<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TACAIPAY JP</title>
  <style>
    :root{--navy:#0f172a;--blue:#0b74de;--bg:#f5f7fb;--card:#fff;--border:#d9e2ec;--muted:#64748b;--ok:#047857;--warn:#b45309;--danger:#b91c1c;--text:#172033}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text)}
    header{background:linear-gradient(135deg,var(--navy),#123c69);color:#fff;padding:18px 28px;box-shadow:0 3px 14px rgba(15,23,42,.2)}
    .top{display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap}.brand h1{font-size:22px;margin:0}.brand p{margin:4px 0 0;color:#cbd5e1}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .portal{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.35);padding:8px 12px;border-radius:8px}select,input,button,textarea{font:inherit}select,input,textarea{border:1px solid var(--border);border-radius:8px;padding:9px 10px;background:#fff}button{border:0;border-radius:8px;padding:9px 12px;background:var(--blue);color:#fff;cursor:pointer;font-weight:650}button.secondary{background:#e2e8f0;color:#0f172a}button.warn{background:var(--warn)}button.danger{background:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed}
    nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.tab{background:rgba(255,255,255,.12);color:#fff}.tab.active{background:#fff;color:#0f172a}
    main{padding:24px;max-width:1500px;margin:0 auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.06);margin-bottom:16px}.metric .label{color:var(--muted);font-size:13px}.metric .value{font-size:28px;font-weight:760;margin-top:8px}.metric .sub{color:var(--muted);font-size:12px;margin-top:4px}
    h2{margin:0 0 14px}h3{margin:18px 0 10px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:10px 0}.form-grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field input,.field select,.field textarea{width:100%}
    .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;background:#fff}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:10px 12px;border-bottom:1px solid #edf2f7;text-align:left;vertical-align:top}th{background:#f8fafc;color:#334155;font-size:12px;text-transform:uppercase;letter-spacing:.03em}td.num{text-align:right;font-variant-numeric:tabular-nums}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;background:#e0f2fe;color:#075985}.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.danger{background:#fee2e2;color:#991b1b}.msg{padding:12px;border-radius:10px;border:1px solid #bfdbfe;background:#eff6ff;color:#1e3a8a;margin:12px 0}.msg.warn{border-color:#fed7aa;background:#fff7ed;color:#9a3412}.hidden{display:none!important}.object{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.employee-picker{border:1px solid #d6e4f2;background:#f8fbff;border-radius:14px;padding:14px;margin-bottom:14px}.helper{color:var(--muted);font-size:12px;margin-top:6px}.workflow{display:flex;gap:8px;flex-wrap:wrap}.step{padding:8px 10px;border-radius:999px;background:#e2e8f0;color:#334155;font-size:12px}.step.done{background:#dcfce7;color:#166534}.footer-note{color:var(--muted);font-size:12px;margin-top:16px}.limit{background:#fff7ed;border-color:#fed7aa}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.messages{max-width:280px;color:#92400e;font-size:12px}.link-button{display:inline-block;text-decoration:none;border-radius:8px;padding:8px 10px;background:#e2e8f0;color:#0f172a;font-weight:650;margin:2px}@media(max-width:900px){.grid,.object,.form-grid{grid-template-columns:1fr}main{padding:14px}table{min-width:760px}}
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div class="brand"><h1>TACAIPAY JP</h1><p data-i18n="subtitle">日本派遣・猎头薪资管理系统</p></div>
      <div class="actions"><a class="portal" href="http://127.0.0.1:8005/" data-i18n="backPortal">Back to Portal</a><select id="lang"><option value="ja">日本語</option><option value="zh">中文</option><option value="en">English</option></select><button class="secondary" onclick="refreshAll()" data-i18n="refresh">Refresh</button></div>
    </div>
    <nav id="tabs"></nav>
  </header>
  <main>
    <div id="message"></div>
    <section id="view-dashboard"></section>
    <section id="view-master" class="hidden"></section>
    <section id="view-batches" class="hidden"></section>
    <section id="view-records" class="hidden"></section>
    <section id="view-payslips" class="hidden"></section>
    <section id="view-reports" class="hidden"></section>
    <section id="view-settings" class="hidden"></section>
    <section id="view-audit" class="hidden"></section>
  </main>
<script>
const dict={
  zh:{subtitle:'日本派遣/猎头中小企业薪资管理系统',backPortal:'返回 Portal',refresh:'刷新',dashboard:'Dashboard',master:'工资主数据',batches:'月度工资表',records:'工资记录',payslips:'工资单/反馈',reports:'报表',settings:'薪资项目/参数',audit:'审计',openBatches:'进行中批次',employees:'工资员工',netTotal:'实发合计',employerCost:'公司负担',createBatch:'创建月度工资表',payrollMonth:'工资月份',entity:'法人/实体',paymentDate:'发薪日',create:'创建',importEmployees:'从 EmployeeAdmin 导入',manualProfile:'手工新增工资档案',employeeId:'员工ID',employeeNo:'员工编号',name:'姓名',salaryType:'薪资类型',baseSalary:'月薪',hourlyRate:'时薪',dailyRate:'日薪',transport:'交通费',save:'保存',status:'状态',actions:'操作',loadMaster:'导入主数据',calculate:'计算',hrReview:'HR确认',firstApprove:'一级审批',finalApprove:'最终审批',finalize:'锁定',payslipGenerate:'生成HTML工资单',payslipSend:'邮件Dry-run',paymentPrepare:'付款准备',markPaid:'标记已发薪',gross:'应发',deductions:'扣除',net:'实发',companyCost:'总成本',attendance:'考勤/变动项',workDays:'出勤天数',regularHours:'普通工时',overtimeHours:'加班',lateNightHours:'深夜',holidayHours:'休日',absenceDays:'缺勤天数',manualTax:'所得税(手工)',residentTax:'住民税(手工)',update:'更新',download:'打开/打印HTML',costSummary:'月度成本汇总',statutoryNote:'注意：日本法定税社保为参数辅助，最终须由HR/薪酬/税理士确认。',limitations:'MVP限制',exports:'导出',messages:'计算信息'},
  ja:{subtitle:'日本派遣・ヘッドハンティング向け給与管理システム',backPortal:'ポータルへ戻る',refresh:'更新',dashboard:'ダッシュボード',master:'給与マスタ',batches:'月次給与表',records:'給与レコード',payslips:'給与明細/確認',reports:'レポート',settings:'項目/パラメータ',audit:'監査ログ',openBatches:'進行中バッチ',employees:'給与対象者',netTotal:'差引支給合計',employerCost:'会社負担',createBatch:'月次給与表作成',payrollMonth:'給与月',entity:'法人/エンティティ',paymentDate:'支払日',create:'作成',importEmployees:'EmployeeAdminから取込',manualProfile:'給与マスタ手入力',employeeId:'従業員ID',employeeNo:'従業員番号',name:'氏名',salaryType:'給与区分',baseSalary:'月給',hourlyRate:'時給',dailyRate:'日給',transport:'通勤手当',save:'保存',status:'ステータス',actions:'操作',loadMaster:'マスタ読込',calculate:'計算',hrReview:'HR確認',firstApprove:'一次承認',finalApprove:'最終承認',finalize:'確定ロック',payslipGenerate:'HTML明細生成',payslipSend:'メールDry-run',paymentPrepare:'支払準備',markPaid:'支払済',gross:'支給',deductions:'控除',net:'差引支給',companyCost:'総コスト',attendance:'勤怠/変動項目',workDays:'出勤日数',regularHours:'通常時間',overtimeHours:'残業',lateNightHours:'深夜',holidayHours:'休日',absenceDays:'欠勤日数',manualTax:'所得税(手入力)',residentTax:'住民税(手入力)',update:'更新',download:'HTMLを開く/印刷',costSummary:'月次コスト集計',statutoryNote:'注意：日本の法定税社保はパラメータ補助です。最終確認はHR/給与/税理士が行ってください。',limitations:'MVP制限',exports:'エクスポート',messages:'計算メッセージ'},
  en:{subtitle:'Japan payroll system for dispatch and recruiting companies',backPortal:'Back to Portal',refresh:'Refresh',dashboard:'Dashboard',master:'Salary Master',batches:'Monthly Payroll',records:'Payroll Records',payslips:'Payslips/Feedback',reports:'Reports',settings:'Items/Parameters',audit:'Audit Logs',openBatches:'Open batches',employees:'Payroll employees',netTotal:'Net total',employerCost:'Employer cost',createBatch:'Create monthly payroll',payrollMonth:'Payroll month',entity:'Entity',paymentDate:'Payment date',create:'Create',importEmployees:'Import from EmployeeAdmin',manualProfile:'Manual salary profile',employeeId:'Employee ID',employeeNo:'Employee no.',name:'Name',salaryType:'Salary type',baseSalary:'Monthly salary',hourlyRate:'Hourly rate',dailyRate:'Daily rate',transport:'Transportation',save:'Save',status:'Status',actions:'Actions',loadMaster:'Load master',calculate:'Calculate',hrReview:'HR review',firstApprove:'1st approve',finalApprove:'Final approve',finalize:'Finalize',payslipGenerate:'Generate HTML payslips',payslipSend:'Email dry-run',paymentPrepare:'Prepare payment',markPaid:'Mark paid',gross:'Gross',deductions:'Deductions',net:'Net',companyCost:'Company cost',attendance:'Attendance/variables',workDays:'Work days',regularHours:'Regular hours',overtimeHours:'Overtime',lateNightHours:'Late night',holidayHours:'Holiday',absenceDays:'Absence days',manualTax:'Income tax manual',residentTax:'Resident tax manual',update:'Update',download:'Open/print HTML',costSummary:'Monthly cost summary',statutoryNote:'Note: Japan statutory tax/social insurance values are parameter-assisted. HR/payroll/tax specialists must confirm final values.',limitations:'MVP limitations',exports:'Exports',messages:'Calculation messages'}
};
const tabs=['dashboard','master','batches','records','payslips','reports','settings','audit'];
const workflow=['draft_created','master_loaded','attendance_input','calculated','hr_reviewed','first_approved','payslips_generated','payslip_sent','final_approved','finalized','payment_prepared','paid'];
const actionLabels={'load-master':'loadMaster','calculate':'calculate','hr-review':'hrReview','first-approve':'firstApprove','payslips/generate':'payslipGenerate','payslips/send':'payslipSend','final-approve':'finalApprove','finalize':'finalize','payment/prepare':'paymentPrepare','payment/mark-paid':'markPaid'};
const actionAllowed={
  'draft_created':['load-master'],
  'master_loaded':['calculate'],
  'attendance_input':['calculate'],
  'calculated':['calculate','hr-review'],
  'hr_reviewed':['first-approve'],
  'first_approved':['payslips/generate'],
  'payslips_generated':['payslips/send'],
  'payslip_sent':['final-approve'],
  'employee_feedback':['final-approve'],
  'final_approved':['finalize'],
  'finalized':['payment/prepare'],
  'sent_to_finance':['payment/prepare'],
  'payment_prepared':['payment/mark-paid']
};
let lang=localStorage.getItem('tacaipayjp_lang')||'ja';
let state={salaryMaster:[],employeeCandidates:[],batches:[],records:[],payslips:[],deliveries:[],feedback:[],items:[],parameters:[],audit:[],summary:{},config:{}};
function t(k){return (dict[lang]&&dict[lang][k])||dict.en[k]||k}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function yen(v){return '¥'+Number(v||0).toLocaleString()}
function badge(s){let text=esc(s||'');let cls=(String(s).includes('paid')||String(s).includes('approved')||String(s).includes('final'))?'ok':(String(s).includes('missing')||String(s).includes('correction')?'danger':'warn');return `<span class="pill ${cls}">${text}</span>`}
function show(msg,type=''){document.getElementById('message').innerHTML=msg?`<div class="msg ${type}">${esc(msg)}</div>`:''}
async function api(path,opts={}){let res=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});let text=await res.text();let data=text?JSON.parse(text):{};if(!res.ok)throw new Error(data.message||data.error||res.statusText);return data}
async function refreshAll(){try{let [c,m,e,b,r,p,d,f,i,pa,a,s]=await Promise.all([api('/api/v1/config'),api('/api/v1/salary-master'),api('/api/v1/employeeadmin-employees?country_code=JP'),api('/api/v1/batches'),api('/api/v1/records'),api('/api/v1/payslips'),api('/api/v1/email-deliveries'),api('/api/v1/feedback'),api('/api/v1/payroll-items'),api('/api/v1/parameters'),api('/api/v1/audit-logs'),api('/api/v1/reports/summary')]);state={config:c,salaryMaster:m.records||[],employeeCandidates:e.employees||[],batches:b.records||[],records:r.records||[],payslips:p.records||[],deliveries:d.records||[],feedback:f.records||[],items:i.records||[],parameters:pa.records||[],audit:a.records||[],summary:s};render()}catch(e){show(e.message,'warn')}}
function applyLang(){document.documentElement.lang=lang;document.getElementById('lang').value=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.getElementById('tabs').innerHTML=tabs.map(x=>`<button class="tab ${x==='dashboard'?'active':''}" data-tab="${x}">${t(x)}</button>`).join('');document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>switchTab(btn.dataset.tab));render()}
function switchTab(tab){tabs.forEach(x=>{document.getElementById('view-'+x).classList.toggle('hidden',x!==tab)});document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function render(){renderDashboard();renderMaster();renderBatches();renderRecords();renderPayslips();renderReports();renderSettings();renderAudit()}
function renderDashboard(){let open=state.batches.filter(b=>!['paid','archived'].includes(b.status)).length;let latest=state.batches[0]||{};let idx=workflow.indexOf(latest.status);document.getElementById('view-dashboard').innerHTML=`<div class="grid"><div class="card metric"><div class="label">${t('openBatches')}</div><div class="value">${open}</div></div><div class="card metric"><div class="label">${t('employees')}</div><div class="value">${state.salaryMaster.length}</div></div><div class="card metric"><div class="label">${t('netTotal')}</div><div class="value">${yen(state.summary.net_total)}</div></div><div class="card metric"><div class="label">${t('employerCost')}</div><div class="value">${yen(state.summary.employer_cost_total)}</div></div></div><div class="card"><h2>TACAIPAY JP</h2><div class="workflow">${workflow.map((x,i)=>`<span class="step ${i<=idx?'done':''}">${esc(x)}</span>`).join('')}</div><p class="footer-note">${t('statutoryNote')}</p></div><div class="card limit"><h2>${t('limitations')}</h2><ul>${(state.config.mvp_limitations||[]).map(x=>`<li>${esc(x)}</li>`).join('')}<li>HTML payslips can be printed/saved as PDF manually.</li></ul></div>`}
function renderMaster(){document.getElementById('view-master').innerHTML=`<div class="object"><div class="card"><h2>${t('master')}</h2><div class="toolbar"><button onclick="importEmployees()">${t('importEmployees')}</button></div><div class="table-wrap"><table><thead><tr><th>${t('employeeNo')}</th><th>${t('name')}</th><th>Email</th><th>${t('entity')}</th><th>Department</th><th>${t('salaryType')}</th><th>${t('baseSalary')}</th><th>${t('hourlyRate')}</th><th>${t('dailyRate')}</th><th>${t('status')}</th></tr></thead><tbody>${state.salaryMaster.map(p=>`<tr><td>${esc(p.employee_number)}</td><td>${esc(p.display_name)}</td><td>${esc(p.email)}</td><td>${esc(p.entity_id)}</td><td>${esc(p.department||p.department_id)}</td><td>${esc(p.salary_type)}</td><td class="num">${yen(p.base_salary)}</td><td class="num">${yen(p.hourly_rate)}</td><td class="num">${yen(p.daily_rate)}</td><td>${badge(p.status)}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h2>${t('manualProfile')}</h2><div class="employee-picker"><h3>EmployeeAdmin employee selection</h3><div class="form-grid"><div class="field"><label>${t('entity')}</label><input id="pick_entity" value="default"></div><div class="field"><label>Department</label><input id="pick_department"></div><div class="field"><label>${t('employeeNo')} / ${t('name')}</label><input id="pick_q"></div><div class="field"><label>&nbsp;</label><button class="secondary" onclick="searchEmployees()">Search</button></div></div><div class="field"><label>${t('employees')}</label><select id="pick_employee" onchange="applyEmployee()"><option value="">Select EmployeeAdmin employee</option>${state.employeeCandidates.map((e,i)=>`<option value="${i}">${esc(e.employee_number)} - ${esc(e.display_name)} - ${esc(e.department||e.department_id||'')}</option>`).join('')}</select><div class="helper">${state.employeeCandidates.length} JP employees loaded. Selecting an employee fills identity/entity fields; payroll fields remain editable.</div></div></div><div class="form-grid"><div class="field"><label>${t('employeeId')}</label><input id="m_employee_id"></div><div class="field"><label>${t('employeeNo')}</label><input id="m_employee_number"></div><div class="field"><label>${t('name')}</label><input id="m_display_name"></div><div class="field"><label>Email</label><input id="m_email"></div><div class="field"><label>${t('entity')}</label><input id="m_entity_id" value="default"></div><div class="field"><label>Department</label><input id="m_department"></div><div class="field"><label>${t('salaryType')}</label><select id="m_salary_type"><option>monthly</option><option>hourly</option><option>daily</option><option>mixed</option><option>manual</option></select></div><div class="field"><label>${t('baseSalary')}</label><input id="m_base_salary" type="number" value="300000"></div><div class="field"><label>${t('hourlyRate')}</label><input id="m_hourly_rate" type="number" value="0"></div><div class="field"><label>${t('dailyRate')}</label><input id="m_daily_rate" type="number" value="0"></div><div class="field"><label>${t('transport')}</label><input id="m_transport" type="number" value="0"></div></div><div class="toolbar"><button onclick="createProfile()">${t('save')}</button></div></div></div>`}
function renderBatches(){document.getElementById('view-batches').innerHTML=`<div class="card"><h2>${t('createBatch')}</h2><div class="form-grid"><div class="field"><label>${t('payrollMonth')}</label><input id="b_month" value="${new Date().toISOString().slice(0,7)}"></div><div class="field"><label>${t('entity')}</label><input id="b_entity" value="default"></div><div class="field"><label>${t('paymentDate')}</label><input id="b_payment" type="date"></div></div><div class="toolbar"><button onclick="createBatch()">${t('create')}</button></div></div><div class="card"><h2>${t('batches')}</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>${t('payrollMonth')}</th><th>${t('entity')}</th><th>${t('status')}</th><th>${t('employees')}</th><th>${t('gross')}</th><th>${t('net')}</th><th>${t('actions')}</th></tr></thead><tbody>${state.batches.map(b=>`<tr><td class="mono">${esc(b.batch_id)}</td><td>${esc(b.payroll_month)}</td><td>${esc(b.entity_id)}</td><td>${badge(b.status)}</td><td class="num">${b.record_count||0}</td><td class="num">${yen(b.gross_total)}</td><td class="num">${yen(b.net_total)}</td><td>${batchButtons(b)}</td></tr>`).join('')}</tbody></table></div></div>`}
function batchButtons(b){let all=['load-master','calculate','hr-review','first-approve','payslips/generate','payslips/send','final-approve','finalize','payment/prepare','payment/mark-paid'];let allowed=new Set(actionAllowed[b.status]||[]);return all.map(a=>`<button class="secondary" ${allowed.has(a)?'':'disabled'} title="${esc(b.status)}" onclick="batchAction('${esc(b.batch_id)}','${a}')">${t(actionLabels[a])}</button>`).join(' ')}
function renderRecords(){document.getElementById('view-records').innerHTML=`<div class="card"><h2>${t('records')}</h2><div class="table-wrap"><table><thead><tr><th>${t('employeeNo')}</th><th>${t('name')}</th><th>${t('status')}</th><th>${t('gross')}</th><th>${t('deductions')}</th><th>${t('net')}</th><th>${t('companyCost')}</th><th>${t('messages')}</th><th>${t('attendance')}</th></tr></thead><tbody>${state.records.map(r=>`<tr><td>${esc(r.employee_number)}</td><td>${esc(r.display_name)}</td><td>${badge(r.status)}</td><td class="num">${yen(r.gross_total)}</td><td class="num">${yen(r.deduction_total)}</td><td class="num">${yen(r.net_pay)}</td><td class="num">${yen(r.company_total_cost)}</td><td class="messages">${(r.calculation_messages||[]).map(esc).join('<br>')}</td><td>${recordForm(r)}</td></tr>`).join('')}</tbody></table></div></div>`}
function recordForm(r){let a=r.attendance||{};let locked=['finalized','payment_prepared','paid'].includes(r.status);return `<details><summary>${t('update')}</summary><div class="form-grid"><input id="wd_${esc(r.record_id)}" placeholder="${t('workDays')}" value="${esc(a.work_days||20)}" onchange="autoRegularHours('${esc(r.record_id)}')"><input id="rh_${esc(r.record_id)}" placeholder="${t('regularHours')}" value="${esc(a.regular_hours||160)}"><input id="oh_${esc(r.record_id)}" placeholder="${t('overtimeHours')}" value="${esc(a.overtime_hours||0)}"><input id="ln_${esc(r.record_id)}" placeholder="${t('lateNightHours')}" value="${esc(a.late_night_hours||0)}"><input id="hh_${esc(r.record_id)}" placeholder="${t('holidayHours')}" value="${esc(a.holiday_hours||0)}"><input id="ab_${esc(r.record_id)}" placeholder="${t('absenceDays')}" value="${esc(a.absence_days||0)}"><input id="it_${esc(r.record_id)}" placeholder="${t('manualTax')}" value="${esc(r.manual_income_tax||0)}"><input id="rt_${esc(r.record_id)}" placeholder="${t('residentTax')}" value="${esc(r.manual_resident_tax||0)}"></div><button ${locked?'disabled':''} onclick="updateRecord('${esc(r.record_id)}')">${t('save')}</button></details>`}
function renderPayslips(){document.getElementById('view-payslips').innerHTML=`<div class="card"><h2>${t('payslips')}</h2><p class="footer-note">HTML payslips open in a new tab and can be printed/saved as PDF by the browser.</p><div class="table-wrap"><table><thead><tr><th>ID</th><th>${t('employeeNo')}</th><th>${t('name')}</th><th>Email</th><th>Type</th><th>Review</th><th>${t('status')}</th><th>${t('actions')}</th></tr></thead><tbody>${state.payslips.map(p=>`<tr><td class="mono">${esc(p.payslip_id)}</td><td>${esc(p.employee_number)}</td><td>${esc(p.display_name)}</td><td>${esc(p.employee_email)}</td><td>${esc(p.document_type||'html_payslip')}</td><td>${p.review_required?'Required':'-'}</td><td>${badge(p.status)}</td><td><a class="link-button" href="/api/v1/payslips/${encodeURIComponent(p.payslip_id)}/download" target="_blank">${t('download')}</a></td></tr>`).join('')}</tbody></table></div><h3>Email dry-run</h3><div class="table-wrap"><table><thead><tr><th>Time</th><th>Recipient</th><th>Status</th><th>Payslip</th></tr></thead><tbody>${state.deliveries.slice().reverse().map(d=>`<tr><td>${esc(d.created_at)}</td><td>${esc(d.recipient||'')}</td><td>${badge(d.status)}</td><td class="mono">${esc(d.payslip_id)}</td></tr>`).join('')}</tbody></table></div><h3>Feedback</h3><pre>${esc(JSON.stringify(state.feedback,null,2))}</pre></div>`}
function renderReports(){let latest=state.batches[0];document.getElementById('view-reports').innerHTML=`<div class="card"><h2>${t('costSummary')}</h2><div class="grid"><div class="metric"><div class="label">${t('gross')}</div><div class="value">${yen(state.summary.gross_total)}</div></div><div class="metric"><div class="label">${t('deductions')}</div><div class="value">${yen(state.summary.deduction_total)}</div></div><div class="metric"><div class="label">${t('net')}</div><div class="value">${yen(state.summary.net_total)}</div></div><div class="metric"><div class="label">${t('companyCost')}</div><div class="value">${yen(state.summary.company_total_cost)}</div></div></div></div><div class="card"><h2>${t('exports')}</h2>${latest?`<a class="link-button" href="/api/v1/batches/${encodeURIComponent(latest.batch_id)}/finance-export.csv">Finance CSV</a><a class="link-button" href="/api/v1/batches/${encodeURIComponent(latest.batch_id)}/payment-export.csv">Payment CSV</a><p class="footer-note">Latest batch: ${esc(latest.batch_id)}</p>`:'<p>No batch yet.</p>'}</div>`}
function renderSettings(){document.getElementById('view-settings').innerHTML=`<div class="object"><div class="card"><h2>${t('settings')}</h2><div class="table-wrap"><table><thead><tr><th>Code</th><th>Category</th><th>JA</th><th>ZH</th><th>EN</th></tr></thead><tbody>${state.items.map(i=>`<tr><td>${esc(i.code)}</td><td>${esc(i.category)}/${esc(i.sub_category)}</td><td>${esc(i.labels?.ja)}</td><td>${esc(i.labels?.zh)}</td><td>${esc(i.labels?.en)}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h2>Parameters</h2><pre>${esc(JSON.stringify(state.parameters,null,2))}</pre></div></div>`}
function renderAudit(){document.getElementById('view-audit').innerHTML=`<div class="card"><h2>${t('audit')}</h2><div class="table-wrap"><table><thead><tr><th>Time</th><th>Action</th><th>Record</th><th>User</th><th>Summary</th></tr></thead><tbody>${state.audit.slice().reverse().map(a=>`<tr><td>${esc(a.timestamp)}</td><td>${esc(a.action)}</td><td class="mono">${esc(a.record_id)}</td><td>${esc(a.user)}</td><td>${esc(a.summary||'')}</td></tr>`).join('')}</tbody></table></div></div>`}
async function searchEmployees(){try{let p=new URLSearchParams({country_code:'JP'});if(v('pick_entity'))p.set('entity_id',v('pick_entity'));if(v('pick_department'))p.set('department',v('pick_department'));if(v('pick_q'))p.set('q',v('pick_q'));let r=await api('/api/v1/employeeadmin-employees?'+p.toString());state.employeeCandidates=r.employees||[];renderMaster()}catch(e){show(e.message,'warn')}}
function setVal(id,val){let el=document.getElementById(id);if(el&&val!==undefined&&val!==null&&val!=='')el.value=val}
function applyEmployee(){let emp=state.employeeCandidates[Number(v('pick_employee'))];if(!emp)return;let payroll=emp.payroll||{};setVal('m_employee_id',emp.employee_id||emp.employee_number);setVal('m_employee_number',emp.employee_number||emp.employee_id);setVal('m_display_name',emp.display_name);setVal('m_email',emp.email);setVal('m_entity_id',emp.entity_id||'default');setVal('m_department',emp.department||emp.department_id);setVal('m_salary_type',emp.salary_type||payroll.salary_type||'monthly');setVal('m_base_salary',emp.base_salary||payroll.base_salary||payroll.salary_amount_yen);setVal('m_hourly_rate',emp.hourly_rate||payroll.hourly_rate);setVal('m_daily_rate',emp.daily_rate||payroll.daily_rate);setVal('m_transport',emp.transportation_allowance||payroll.transportation_allowance_yen)}
async function importEmployees(){try{let r=await api('/api/v1/salary-master/import-employeeadmin',{method:'POST',body:JSON.stringify({})});show(`Imported: created ${r.created}, updated ${r.updated}, skipped ${r.skipped}, incomplete ${r.incomplete||0}`);await refreshAll()}catch(e){show(e.message,'warn')}}
async function createProfile(){let p={employee_id:v('m_employee_id'),employee_number:v('m_employee_number'),display_name:v('m_display_name'),email:v('m_email'),entity_id:v('m_entity_id')||'default',department:v('m_department'),salary_type:v('m_salary_type'),base_salary:num('m_base_salary'),hourly_rate:num('m_hourly_rate'),daily_rate:num('m_daily_rate'),transportation_allowance:num('m_transport')};try{await api('/api/v1/salary-master',{method:'POST',body:JSON.stringify(p)});show('Saved');await refreshAll()}catch(e){show(e.message,'warn')}}
async function createBatch(){try{await api('/api/v1/batches',{method:'POST',body:JSON.stringify({payroll_month:v('b_month'),entity_id:v('b_entity'),payment_date:v('b_payment')})});show('Created');await refreshAll()}catch(e){show(e.message,'warn')}}
async function batchAction(id,action){try{let body=action==='payslips/send'?{dry_run:true}:{};await api('/api/v1/batches/'+encodeURIComponent(id)+'/'+action,{method:'POST',body:JSON.stringify(body)});show('Done: '+action);await refreshAll()}catch(e){show(e.message,'warn')}}
async function updateRecord(id){let attendance={work_days:num('wd_'+id),regular_hours:num('rh_'+id),overtime_hours:num('oh_'+id),late_night_hours:num('ln_'+id),holiday_hours:num('hh_'+id),absence_days:num('ab_'+id)};try{await api('/api/v1/records/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({attendance,manual_income_tax:num('it_'+id),manual_resident_tax:num('rt_'+id)})});show('Updated');await refreshAll()}catch(e){show(e.message,'warn')}}
function v(id){return document.getElementById(id)?.value||''}function num(id){return Number(v(id)||0)}
function autoRegularHours(recordId){let days=num('wd_'+recordId);let hoursInput=document.getElementById('rh_'+recordId);if(hoursInput)hoursInput.value=Math.round(days*8*100)/100}
document.getElementById('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('tacaipayjp_lang',lang);applyLang()};
applyLang();refreshAll();
</script>
</body>
</html>
