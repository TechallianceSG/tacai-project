# Nginx example for the later Tencent Cloud Tokyo migration.
# Assumes Portal/User_admin/Timesheet/Reimbursement run on loopback ports 8005/8006/8002/8003.
# Replace certificate paths with Let's Encrypt or Tencent-managed certificate paths.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name ai.tactokyo.com timesheet.tactokyo.com expense.tactokyo.com useradmin.tactokyo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ai.tactokyo.com;
    ssl_certificate /etc/letsencrypt/live/tactokyo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tactokyo.com/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    server_name timesheet.tactokyo.com;
    ssl_certificate /etc/letsencrypt/live/tactokyo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tactokyo.com/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    server_name expense.tactokyo.com;
    ssl_certificate /etc/letsencrypt/live/tactokyo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tactokyo.com/privkey.pem;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    server_name useradmin.tactokyo.com;
    ssl_certificate /etc/letsencrypt/live/tactokyo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tactokyo.com/privkey.pem;
    # Recommended: add IP allowlist, VPN requirement, or Cloudflare Access equivalent for admin access.
    location / {
        proxy_pass http://127.0.0.1:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
