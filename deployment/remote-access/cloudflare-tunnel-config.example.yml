# Cloudflare Tunnel example for the Nanjing MacBook pilot.
# Manual steps required:
# 1. Create/authenticate a Cloudflare Tunnel for tactokyo.com.
# 2. Replace <TUNNEL-UUID> and /path/to/credentials.json with values from Cloudflare.
# 3. In Cloudflare Access, allow only approved Japan/India/China tester emails.
# 4. Restrict useradmin.tactokyo.com to admin/operator emails only.

tunnel: <TUNNEL-UUID>
credentials-file: /path/to/<TUNNEL-UUID>.json

ingress:
  - hostname: ai.tactokyo.com
    service: http://127.0.0.1:8005
  - hostname: timesheet.tactokyo.com
    service: http://127.0.0.1:8002
  - hostname: expense.tactokyo.com
    service: http://127.0.0.1:8003
  - hostname: useradmin.tactokyo.com
    service: http://127.0.0.1:8006
  - service: http_status:404
